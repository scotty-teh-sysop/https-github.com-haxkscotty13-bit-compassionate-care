<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)" />

  <!-- Inner glowing circle / safe-zone ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.25" />

  <!-- Supporting Heart Emblem -->
  <g filter="url(#softGlow)" transform="translate(256 242) scale(0.9) translate(-256 -242)">
    <!-- Stylized Heart -->
    <path d="M256 380 C246 370 128 274 128 184 C128 126 172 82 230 82 C246 82 260 88 270 96 C280 88 294 82 310 82 C368 82 412 126 412 184 C412 274 266 370 256 380 Z" fill="url(#heartGrad)" />
    
    <!-- Caring hands / clasping arc -->
    <path d="M160 300 C185 340 220 370 256 395 C292 370 327 340 352 300" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    
    <!-- Gentle Plus / Cross of Care in Center -->
    <path d="M256 160 L256 224 M224 192 L288 192" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
